name: CI

on:
  push:
    branches: [main, develop, 'bot/**', 'claude/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Skip the redundant pull_request run for our own auto-generated release PRs:
    # they're opened via GITHUB_TOKEN (gh pr create in auto-pr.yml), and GitHub's
    # loop-prevention rule for GITHUB_TOKEN-authored events means that run can
    # never actually start a job - it just completes with conclusion "failure"
    # and 0 jobs, even though the identical commit already passed CI on push.
    # That spurious failure becomes the newest workflow run and drags down the
    # README badge. The commit was already fully tested by the push trigger, so
    # skip (not fail) instead of re-running.
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          
      - name: Check formatting with black
        run: |
          black --check custom_components/ecowitt_local/ tests/

      - name: Check import order with isort
        run: |
          isort --check-only custom_components/ecowitt_local/ tests/

      - name: Lint with flake8
        run: |
          flake8 custom_components/ecowitt_local --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 custom_components/ecowitt_local --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          
      - name: Type check with mypy
        run: |
          mypy --follow-imports=silent --ignore-missing-imports custom_components/ecowitt_local
          
      - name: Test with pytest
        run: |
          PYTHONPATH="$PWD" pytest tests/ --cov=custom_components.ecowitt_local --cov-report=xml --cov-report=term-missing
          
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}