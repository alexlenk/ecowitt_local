name: HACS Action

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs:
    name: HACS Action
    runs-on: "ubuntu-latest"
    # See ci.yml for why: skips the doomed pull_request run on our own
    # GITHUB_TOKEN-authored auto-release PRs instead of letting it fail.
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    steps:
      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"